services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tuma254
      POSTGRES_USER: tuma254
      POSTGRES_PASSWORD: tuma254
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuma254 -d tuma254"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
