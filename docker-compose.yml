services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tuma254
      POSTGRES_USER: alumasinde
      POSTGRES_PASSWORD: 21082108
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumasinde -d tuma254"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
