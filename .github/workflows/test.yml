name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Initialize MongoDB replica set
        run: |
          docker exec $(docker ps -q --filter ancestor=mongo:8) mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in {1..30}; do
            if docker exec $(docker ps -q --filter ancestor=mongo:8) mongosh --quiet --eval "rs.status().members[0].stateStr" | grep -q PRIMARY; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not become PRIMARY"
          exit 1

      - name: Run tests
        run: go test -mod=mod ./...
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0
