name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tuma254
          POSTGRES_USER: tuma254
          POSTGRES_PASSWORD: tuma254
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuma254 -d tuma254"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      HTTP_ADDR: :8080
      LOG_LEVEL: error
      DATABASE_URL: postgres://tuma254:tuma254@localhost:5432/tuma254?sslmode=disable
      JWT_ACCESS_SECRET: test-access-secret-must-be-long-enough-for-tests
      OTP_HASH_SECRET: test-otp-secret-must-be-long-enough-for-tests
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 720h
      OTP_TTL: 10m
      OTP_RESEND_COOLDOWN: 1s
      OTP_RESEND_WINDOW: 1h
      OTP_MAX_RESENDS: 5
      OTP_MAX_ATTEMPTS: 5
      SMS_PROVIDER: log

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Static analysis
        run: go vet ./...

      - name: Run migrations
        run: go run ./cmd/migrate up

      - name: Run tests
        run: go test ./...
